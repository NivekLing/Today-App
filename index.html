A.vcOpen = () => { if (!speechOK()) return toast(t("Voice input isn’t supported in this browser.")); S.vc = { st: "listening", heard: "", reply: "", muted: false }; S.stack.push({ id: "vc" }); render(); vcListen(); };
function vcSet(o) { Object.assign(S.vc, o); if (S.stack.length && S.stack[S.stack.length - 1].id === "vc") render(); }
function vcListen() {
  if (!S.vc) return; if (S.vc.muted) return vcSet({ st: "idle" });
  vcSet({ st: "listening", heard: "" });
  const vc = S.vc; let done = false;
  speechStart((p) => { if (S.vc === vc) { vc.heard = p; const e = $(".vc-heard"); if (e) e.textContent = p; } }, (f) => { if (S.vc !== vc) return; done = true; vcAsk(f.trim()); }, (e) => { if (S.vc !== vc) return; done = true; if (e === "no-speech") return setTimeout(vcListen, 300); vcSet({ st: "idle", reply: speechErr(e) }); }, () => { if (S.vc === vc && !done && vc.st === "listening") setTimeout(vcListen, 300); });
}
async function vcAsk(text) {
  const vc = S.vc; if (!text) return vcListen();
  vcSet({ st: "thinking", heard: text }); const p = P.ai.p, c = chatOf(p);
  c.push({ r: "user", x: text }); let out;
  try { out = await callAI(p, c); c.push({ r: "ai", x: out }); } catch (e) { c.push({ r: "ai", x: String(e.message), err: 1 }); save(); if (S.vc === vc) vcSet({ st: "idle", reply: String(e.message) }); return; }
  save(); if (S.vc !== vc) return; vcSet({ st: "speaking", reply: out });
  if (!window.speechSynthesis) return vcListen();
  const u = new SpeechSynthesisUtterance(out.replace(/[*_`#]/g, "")); u.lang = LOC || "en"; u.onend = u.onerror = () => { if (S.vc === vc) vcListen(); }; speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function vcEnd() { speechStop(); try { speechSynthesis.cancel(); } catch {} S.vc = null; }

const G_CLIENT = "231710286414-vbbb6dr1tcd07rcvjhe53spk810l07a7.apps.googleusercontent.com";
const G_SCOPE = "openid email profile https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/drive.readonly";
const G = { tok: null, busy: false, drv: { items: [], sel: [], q: "", load: false, err: "" } };
try { G.tok = JSON.parse(localStorage.getItem("today.gtok") || "null"); } catch (e) {}
const gTZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return "UTC"; } })();
const gOpt = (k) => !P.g || P.g[k] !== false;

function gLoadLib() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    let s = document.getElementById("gsi"); if (!s) { s = document.createElement("script"); s.id = "gsi"; s.src = "https://accounts.google.com/gsi/client"; s.async = true; document.head.appendChild(s); }
    s.addEventListener("load", () => res()); s.addEventListener("error", () => { s.remove(); rej(new Error("lib")); });
    setTimeout(() => rej(new Error("timeout")), 15000);
  });
}
/* get a valid access token; interactive=true may open Google's sign-in popup (needs a tap) */
async function gToken(interactive) {
  if (G.tok && G.tok.exp - 60000 > Date.now()) return G.tok.t;
  if (!interactive && !P.g) throw new Error("signed out");
  await gLoadLib();
  return new Promise((res, rej) => {
    const c = google.accounts.oauth2.initTokenClient({
      client_id: G_CLIENT, scope: G_SCOPE, hint: P.g ? P.g.email : undefined,
      callback: (r) => { if (r.error || !r.access_token) return rej(new Error(r.error || "denied")); G.tok = { t: r.access_token, exp: Date.now() + (+r.expires_in || 3600) * 1000 }; try { localStorage.setItem("today.gtok", JSON.stringify(G.tok)); } catch (e) {} res(G.tok.t); },
      error_callback: (e) => rej(new Error((e && e.type) || "popup")),
    });
    c.requestAccessToken({ prompt: interactive && !P.g ? "select_account" : "" });
  });
}
async function gf(url, o = {}, interactive) {
  const tk = await gToken(interactive), r = await fetch(url, { ...o, headers: { Authorization: "Bearer " + tk, ...(o.body ? { "Content-Type": "application/json" } : {}) } });
  if (r.status === 401) { G.tok = null; try { localStorage.removeItem("today.gtok"); } catch (e) {} throw new Error("auth"); }
  if (r.status === 204) return null;
  if (!r.ok) { let m = ""; try { const j = await r.json(); m = (j.error && (j.error.message || j.error.status)) || ""; } catch (e) {} const er = new Error("http " + r.status); er.status = r.status; er.msg = m; throw er; }
  return o.raw ? r : r.json();
}

A.gSignIn = async () => {
  if (G.busy) return; G.busy = true; render();
  try {
    const tk = await gToken(true), u = await (await fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers: { Authorization: "Bearer " + tk } })).json();
    P.g = { email: u.email || "", name: u.name || "", cal: true, tasks: true, last: 0, dc: [], dt: [] }; P.acct = "google";
    if (!P.name.trim() && u.name) P.name = u.name; if (S.w && !S.w.name && u.name) S.w.name = u.name;
    saveNow(); G.busy = false; render(); toast(t("Signed in"), u.email || ""); A.gSync();
  } catch (e) { G.busy = false; render(); toast(t("Couldn’t sign in to Google"), t("Check your connection and that pop-ups are allowed.")); }
};
A.gOut = async () => {
  if (!(await confirmDlg(t("Sign out of Google?"), t("Synced items stay on this device."), t("Sign out"), true))) return;
  try { if (G.tok && window.google) google.accounts.oauth2.revoke(G.tok.t, () => {}); } catch (e) {}
  G.tok = null; try { localStorage.removeItem("today.gtok"); } catch (e) {}
  P.events.forEach((e) => { delete e.gid; delete e.dirty; }); P.todos.forEach((x) => { delete x.gid; delete x.gs; });

SHEETS.crop = () => ({ title: t("Move and Scale"), right: `<button class="btn sm" data-a="crUse">${t("Use")}</button>`, cls: "cropsheet", body: `<div class="cropwrap"><canvas id="cropc" width="${CR}" height="${CR}" aria-label="${t("Crop area")}"></canvas></div><div class="crc"><label>${I("zoom-in")}<input id="crz" type="range" min=".4" max="5" step=".01" value="${S.crop.z}" data-in="crz" aria-label="${t("Zoom")}"></label><label>${I("tilt")}<input id="crt" type="range" min="-45" max="45" step=".5" value="${S.crop.tilt}" data-in="crt" aria-label="${t("Tilt")}"></label><div class="frow" style="justify-content:center"><button class="btn ghost sm" data-a="crRot">${I("rotate-cw")}${t("Rotate")}</button><button class="btn ghost sm" data-a="crReset">${t("Reset")}</button></div></div>` });
init();

</script></body></html>
