<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=overlays-content">
<meta name="theme-color" content="#0c0c0e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Today"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
<title>Today</title>
<style>/* ============================================================
   Today — styles. Everything is sized in em: the base font size is set per layout
   (.m-compact / .m-phone / .m-tablet / .m-desktop), so one rule set serves every screen.
   Themes only change CSS variables (+ a few structural overrides at the bottom).
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
html{background:var(--bg);color:var(--text);font-family:var(--font);color-scheme:dark}
html[data-mode=light]{color-scheme:light}
body{position:fixed;inset:0;background:var(--bg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:var(--font)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:.2em solid var(--accent);outline-offset:.12em}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* ---------- Theme variables ---------- */
[data-theme]{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--hf:var(--font);--tf:var(--font);--tw:600;--hw:600;--hs:.78em;--hl:.06em;--ht:uppercase;--hc:var(--muted);
  --rc:1.5em;--rb:999px;--ri:.85em;--rk:.4em;--rn:999px;--rx:50%;--nbb:999px;--cb:1px solid var(--line);--csh:none;--bf:none;--cgap:.8em;--danger:#ff453a;
  --nbg:var(--surface);--nbd:1px solid var(--line);--nsh:0 .6em 1.8em rgba(0,0,0,.25);--nbf:none;--nmu:var(--muted);--nac:var(--text);--nab:var(--surface-2);--accent2:var(--accent);--on-accent2:var(--on-accent);--sheetbg:var(--bg)}
[data-theme=dark]{--bg:#0c0c0e;--surface:#17171a;--surface-2:#232328;--line:#2e2e34;--text:#f4f4f5;--muted:#a1a1aa;--accent:#f5b83d;--on-accent:#1c1405;--danger:#f87171;--sun:#f5b83d;--cloud:#6e6e78;--rain:#93c5fd;--moon:#e4e4e7;--snow:#e4e4e7;--nbg:rgba(28,28,32,.82);--nbf:blur(16px);--nsh:0 .6em 1.8em rgba(0,0,0,.5)}
/* Basic (Material You, purple) */
[data-theme=basic]{--font:Roboto,"Google Sans",system-ui,sans-serif;--rc:1.75em;--hc:var(--accent);--hw:500;--hs:.9em;--tw:400;--rk:.3em;--ht:none;--hl:0}
[data-theme=basic][data-mode=light]{--bg:#FAF9F6;--surface:#F0F1F3;--text:#1B1F24;--muted:#505A66;--line:#D5DAE0;--accent:#3E9BEA;--on-accent:#fff;--surface-2:#DCEBFA;--sun:#F2A100;--cloud:#B9B2C8;--rain:#4A7BE0;--moon:#6B6A85;--snow:#8FA3C8;--nbg:#EAEEF3}
[data-theme=basic][data-mode=dark]{--bg:#121417;--surface:#1D2126;--text:#E6EAEE;--muted:#B3BCC6;--line:#3A424B;--accent:#8CC4FF;--on-accent:#06294D;--surface-2:#2C3947;--sun:#FFC247;--cloud:#6F6A7C;--rain:#8AB4FF;--moon:#E6E0E9;--snow:#E6E0E9;--nbg:#272C33}
/* Minimalist */
[data-theme=minimal]{--font:Inter,system-ui,sans-serif;--rc:0;--surface:transparent;--cgap:1.4em;--tw:200;--hw:400;--ri:0;--rn:0;--nbb:0;--ht:uppercase}
[data-theme=minimal][data-mode=light]{--bg:#FAFAF9;--text:#111;--muted:#7D7D7D;--line:#E3E3E0;--accent:#111;--on-accent:#fff;--surface-2:#EFEFEC;--sun:#111;--cloud:#C4C4C0;--rain:#111;--moon:#111;--snow:#B5B5B5;--nbg:#FAFAF9}
[data-theme=minimal][data-mode=dark]{--bg:#0B0B0B;--text:#F2F2F2;--muted:#8C8C8C;--line:#262626;--accent:#F2F2F2;--on-accent:#0B0B0B;--surface-2:#1A1A1A;--sun:#F2F2F2;--cloud:#4A4A4A;--rain:#F2F2F2;--moon:#F2F2F2;--snow:#777;--nbg:#0B0B0B}
/* Nothing */
[data-theme=nothing]{--font:"Space Mono",ui-monospace,monospace;--tf:Doto,"Space Mono",monospace;--tw:800;--rc:1.4em;--hs:.72em;--hl:.08em}
[data-theme=nothing][data-mode=light]{--bg:#E9E9E7;--surface:#F7F7F5;--text:#000;--muted:#5E5E5E;--line:#CFCFCB;--accent:#D71921;--on-accent:#fff;--surface-2:#E4E4E0;--sun:#D71921;--cloud:#8A8A86;--rain:#000;--moon:#000;--snow:#777;--nbg:#F7F7F5}
[data-theme=nothing][data-mode=dark]{--bg:#000;--surface:#101010;--text:#fff;--muted:#9B9B9B;--line:#2B2B2B;--accent:#D71921;--on-accent:#fff;--surface-2:#1C1C1C;--sun:#D71921;--cloud:#5C5C5C;--rain:#fff;--moon:#fff;--snow:#bbb;--nbg:#101010}
/* News */
[data-theme=news]{--font:"Source Serif 4",Georgia,serif;--hf:"Playfair Display",Georgia,serif;--tf:"Playfair Display",Georgia,serif;--tw:900;--rc:0;--surface:transparent;--cgap:0;--hs:.78em;--hw:700;--hl:.16em;--rb:0;--ri:0;--rk:0;--rn:0;--nbb:0}
[data-theme=news][data-mode=light]{--bg:#F3EEE1;--text:#1A1814;--muted:#6B6558;--line:#CFC8B5;--accent:#1A1814;--on-accent:#F3EEE1;--surface-2:#E9E2D0;--sun:#1A1814;--cloud:#A39B87;--rain:#2B2A27;--moon:#1A1814;--snow:#6B6558;--nbg:#F3EEE1}
[data-theme=news][data-mode=dark]{--bg:#1B1A17;--text:#EAE4D3;--muted:#A39C89;--line:#46433B;--accent:#EAE4D3;--on-accent:#1B1A17;--surface-2:#2A2824;--sun:#EAE4D3;--cloud:#6E6857;--rain:#EAE4D3;--moon:#EAE4D3;--snow:#A39C89;--nbg:#1B1A17}
/* Liquid Glass (dark only; background follows the weather sky) */
[data-theme=glass]{--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;--rc:2.1em;--text:#fff;--muted:rgba(255,255,255,.78);--line:rgba(255,255,255,.2);--accent:#fff;--on-accent:#0A3A8A;--surface-2:rgba(255,255,255,.2);--sun:#FFD25A;--cloud:rgba(255,255,255,.9);--rain:#A8D6FF;--moon:#EEF3FF;--snow:#fff;--tw:600;--hs:.72em;--hl:.05em;--bf:blur(24px) saturate(190%) brightness(1.05);--sheetbg:rgba(14,34,82,.72);
  --surface:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.03) 45%,rgba(255,255,255,.09)),rgba(12,32,78,.1);--csh:inset 0 0 0 1px rgba(255,255,255,.2),inset 1px 1px 0 rgba(255,255,255,.55),inset -1px -1px 0 rgba(255,255,255,.18),inset 0 0 22px rgba(255,255,255,.07),0 12px 34px rgba(8,25,70,.22);--cb:0;
  --bg:linear-gradient(180deg,#2E7BE6,#5BA8F2 60%,#9CCBF7);--nbg:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 50%,rgba(255,255,255,.1)),rgba(12,32,78,.1);--nbd:0;--nbf:blur(24px) saturate(190%);--nsh:inset 1px 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.22),0 10px 30px rgba(8,25,70,.25);--nmu:rgba(255,255,255,.8);--nac:#fff;--nab:rgba(255,255,255,.24)}
[data-theme=glass][data-sky=partly],[data-theme=glass][data-sky=cloud]{--bg:linear-gradient(180deg,#4E6E99,#7C97B9 60%,#A9BDD2)}
[data-theme=glass][data-sky=fog]{--bg:linear-gradient(180deg,#6F7D8F,#98A4B2 60%,#BAC3CD)}
[data-theme=glass][data-sky=rain]{--bg:linear-gradient(180deg,#34506F,#527396 60%,#7B95AE)}
[data-theme=glass][data-sky=storm]{--bg:linear-gradient(180deg,#232C47,#3F4872 60%,#5F668F)}
[data-theme=glass][data-sky=snow]{--bg:linear-gradient(180deg,#637FA3,#8EA7C4 60%,#BCCDE0)}
[data-theme=glass][data-sky=clear-n]{--bg:linear-gradient(180deg,#0B1538,#232B6B 60%,#4A3A85)}
[data-theme=glass][data-sky=partly-n],[data-theme=glass][data-sky=cloud-n]{--bg:linear-gradient(180deg,#141E38,#2E4166 60%,#4C6089)}
[data-theme=glass][data-sky=fog-n]{--bg:linear-gradient(180deg,#1C2432,#38455A 60%,#566478)}
[data-theme=glass][data-sky=rain-n]{--bg:linear-gradient(180deg,#0D1729,#223350 60%,#3A506D)}
[data-theme=glass][data-sky=storm-n]{--bg:linear-gradient(180deg,#0C1122,#222846 60%,#3A3F63)}
[data-theme=glass][data-sky=snow-n]{--bg:linear-gradient(180deg,#25344F,#44597C 60%,#748CAD)}
/* iOS 18 */
[data-theme=ios18]{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;--rc:1.2em;--hs:.78em;--hw:400;--hl:.02em;--tw:300;--nbd:.5px solid var(--line);--nsh:none;--nbf:blur(20px) saturate(180%);--nab:transparent;--nac:var(--accent);--ri:.7em;--rb:999px;--rn:0}
[data-theme=ios18][data-mode=light]{--bg:#F2F2F7;--surface:#fff;--text:#000;--muted:#6C6C70;--line:#D8D8DD;--accent:#007AFF;--on-accent:#fff;--surface-2:#E9E9EF;--sun:#FF9F0A;--cloud:#C7C7CC;--rain:#0A84FF;--moon:#5E5CE6;--snow:#8E8E93;--nbg:rgba(249,249,249,.86)}
[data-theme=ios18][data-mode=dark]{--bg:#000;--surface:#1C1C1E;--text:#fff;--muted:#98989F;--line:#38383A;--accent:#0A84FF;--on-accent:#fff;--surface-2:#2C2C2E;--sun:#FF9F0A;--cloud:#636366;--rain:#64D2FF;--moon:#BF5AF2;--snow:#AEAEB2;--nbg:rgba(28,28,30,.86)}
/* iOS 6 */
[data-theme=ios6]{--font:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;--rc:.8em;--cb:1px solid #ABABAB;--csh:0 1px 0 rgba(255,255,255,.8);--hs:.82em;--hw:700;--tw:300;--rb:.45em;--ri:.45em;--rn:0;--nbd:1px solid #000;--nsh:none;--nbg:linear-gradient(#5A5A5A,#1B1B1B 50%,#000 51%,#0C0C0C);--nmu:#B8BDC6;--nac:#fff;--nab:linear-gradient(#4C8FE8,#1E5FC4);--nbb:.5em;--ht:none;--hl:0}
[data-theme=ios6][data-mode=light]{--bg:repeating-linear-gradient(90deg,#C5CCD4 0 5px,#CBD2D8 5px 10px);--surface:#fff;--text:#000;--muted:#4C566C;--line:#D4D4D4;--accent:#2F6FD6;--on-accent:#fff;--surface-2:#DDE6F4;--sun:#FFC71F;--cloud:#BFC8D2;--rain:#3F83DF;--moon:#6B7A99;--snow:#9FB0C8;--sheetbg:#E3E7EC}
[data-theme=ios6][data-mode=dark]{--bg:repeating-linear-gradient(90deg,#2A2E35 0 5px,#2E3239 5px 10px);--surface:#3A3F49;--text:#F2F4F7;--muted:#A9B3C6;--line:#4A505B;--accent:#5B9AF0;--on-accent:#fff;--surface-2:#4A5160;--sun:#FFC71F;--cloud:#8995A6;--rain:#6AA6F2;--moon:#C9D3E8;--snow:#C9D3E8;--sheetbg:#2E3239}
/* Android 4 (Holo) */
[data-theme=android4]{--font:Roboto,"Helvetica Neue",sans-serif;--rc:0;--cb:1px solid var(--line);--hs:.78em;--hw:500;--hl:.02em;--hc:var(--accent);--tw:300;--rb:.1em;--ri:0;--rn:0;--rk:.1em;--cgap:.5em;--nbb:0;--nsh:none;--nab:transparent;--nac:var(--accent)}
[data-theme=android4][data-mode=dark]{--bg:#000;--surface:#0B0B0B;--text:#fff;--muted:#9B9B9B;--line:#2A2A2A;--accent:#33B5E5;--on-accent:#000;--surface-2:#1A1A1A;--sun:#FFBB33;--cloud:#6B6B6B;--rain:#33B5E5;--moon:#ccc;--snow:#fff;--nbg:#000}
[data-theme=android4][data-mode=light]{--bg:#EDEDED;--surface:#fff;--text:#333;--muted:#777;--line:#D6D6D6;--accent:#0099CC;--on-accent:#fff;--surface-2:#E3F3FA;--sun:#FF8800;--cloud:#B5B5B5;--rain:#0099CC;--moon:#555;--snow:#888;--nbg:#fff}
/* Material */
[data-theme=material]{--font:Roboto,sans-serif;--rc:.25em;--csh:0 2px 5px rgba(0,0,0,.26),0 0 3px rgba(0,0,0,.12);--cb:0;--hs:.85em;--hw:500;--hc:var(--accent);--tw:300;--rb:.2em;--ri:.2em;--rn:0;--rk:.15em;--nbb:.2em;--nsh:0 -2px 5px rgba(0,0,0,.2);--nbd:0;--nab:transparent;--nac:var(--accent);--ht:uppercase}
[data-theme=material][data-mode=light]{--bg:#EEEEEE;--surface:#fff;--text:#212121;--muted:#757575;--line:#E0E0E0;--accent:#3F51B5;--on-accent:#fff;--surface-2:#E8EAF6;--sun:#FFB300;--cloud:#BDBDBD;--rain:#3F51B5;--moon:#546E7A;--snow:#90A4AE;--nbg:#fff}
[data-theme=material][data-mode=dark]{--bg:#303030;--surface:#424242;--text:#fff;--muted:#B0B0B0;--line:#5A5A5A;--accent:#8C9EFF;--on-accent:#1A237E;--surface-2:#505678;--sun:#FFCA28;--cloud:#757575;--rain:#82B1FF;--moon:#CFD8DC;--snow:#ECEFF1;--nbg:#424242}
/* Material You (green by default; colors are user-editable) */
[data-theme=materialu]{--font:Roboto,"Google Sans",system-ui,sans-serif;--rc:1.75em;--hc:var(--accent);--hw:500;--hs:.9em;--tw:400;--rk:.3em;--ht:none;--hl:0}
[data-theme=materialu][data-mode=light]{--bg:#FDFDF5;--surface:#EFEFE6;--text:#1B1C18;--muted:#44483D;--line:#C5C8B8;--accent:#386A20;--on-accent:#fff;--surface-2:#D7E8CD;--sun:#E5A100;--cloud:#B7BDAC;--rain:#3E7FBF;--moon:#5B6150;--snow:#8FA68A;--nbg:#E9EADF}
[data-theme=materialu][data-mode=dark]{--bg:#12140E;--surface:#1E201A;--text:#E3E3DB;--muted:#C4C8B8;--line:#44483D;--accent:#A1D386;--on-accent:#153900;--surface-2:#3A4B32;--sun:#F7C84A;--cloud:#5E6456;--rain:#8CB8F0;--moon:#E3E3DB;--snow:#E3E3DB;--nbg:#262920}

/* ---------- Stage / device ---------- */
.page,.stage{position:absolute;inset:0}
.stage{display:flex;align-items:center;justify-content:center}
.frame{position:relative;flex:none}
.device{position:absolute;top:0;left:0;transform-origin:top left;background:var(--bg);overflow:hidden;font-size:15px;line-height:1.35;color:var(--text);font-family:var(--font)}
.device.m-compact{font-size:17px}.device.m-phone{font-size:15px}.device.m-tablet,.device.m-desktop{font-size:16px}
.device::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0}
.view{position:absolute;inset:0;padding:1.2em 1em 6.6em;overflow-y:auto;scrollbar-width:none;z-index:1}
.view::-webkit-scrollbar,.sheet-body::-webkit-scrollbar,.msgs::-webkit-scrollbar{display:none}
.m-phone .view{padding:1.6em .9em 6.8em}
.m-tablet .view,.m-desktop .view{padding:1.8em 1.8em 7em}
.wrap{margin:0 auto}.wrap.full{height:100%}
.m-tablet .wrap{max-width:66em}.m-desktop .wrap{max-width:78em}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9em;padding:0 .25em;gap:.6em}
.head h1{font-family:var(--hf);font-size:1.55em;margin:0;font-weight:var(--hw);letter-spacing:-.01em}
.head p{margin:.15em 0 0;font-size:.87em;color:var(--muted)}
.pill{font-size:.8em;color:var(--muted);background:var(--surface);border:var(--cb);padding:.4em .7em;border-radius:999px;display:inline-flex;align-items:center;gap:.4em;white-space:nowrap;box-shadow:var(--csh);backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
.pill svg{width:1em;height:1em}
svg.i{width:1.25em;height:1.25em}

/* ---------- Home grid + cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:8.4em;gap:var(--cgap)}
.m-phone .grid{grid-auto-rows:9.6em;gap:.7em}
.m-tablet .grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:10.6em}
.m-desktop .grid{grid-template-columns:repeat(6,1fr);grid-auto-rows:10.8em}
.card{position:relative;background:var(--surface);border:var(--cb);box-shadow:var(--csh);backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf);border-radius:var(--rc);padding:1em;text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .2s ease,border-color .2s;container-type:inline-size;min-width:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card:active{transform:scale(.98)}
.w2{grid-column:span 2}.h2{grid-row:span 2}
.label{font-family:var(--hf);font-size:var(--hs);font-weight:var(--hw);letter-spacing:var(--hl);text-transform:var(--ht);color:var(--hc);display:flex;align-items:center;gap:.4em;margin-bottom:.15em}
.label svg{width:1.2em;height:1.2em}
.big{font-family:var(--tf);font-size:min(4.4em,21cqw);font-weight:var(--tw);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--font);font-size:.28em;letter-spacing:0;margin-left:.4em;color:var(--muted);font-weight:500}
.mid{font-family:var(--tf);font-size:min(2.7em,18cqw);font-weight:var(--tw);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.sub{font-size:.87em;color:var(--muted)}
.grow{flex:1}.mu{color:var(--muted)}
.card .empty-note{color:var(--muted);font-size:.9em;margin:auto 0}
.ev{display:flex;gap:.7em;align-items:stretch;padding:.5em 0;border-bottom:1px solid var(--line);min-width:0}
.ev:last-child{border-bottom:0}
.ev .bar{width:.28em;border-radius:.3em;flex:none;background:var(--accent)}
.ev .t{font-size:.8em;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .n{font-size:.95em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev>div{min-width:0}
.ev.past{opacity:.45}
.now-tag{font-size:.7em;background:var(--accent2);color:var(--on-accent2);border-radius:.3em;padding:.05em .4em;margin-left:.5em;font-weight:700}
.todo{display:flex;align-items:center;gap:.7em;padding:.4em 0;width:100%;text-align:left;min-width:0}
.todo>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box{width:1.4em;height:1.4em;border-radius:var(--rk);border:.12em solid var(--muted);flex:none;display:grid;place-items:center}
.todo.done .box,.trow.done .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.todo.done span:last-child,.trow.done .tt{color:var(--muted);text-decoration:line-through}
.box svg{width:.95em;height:.95em}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:.6em}
.editing .card{animation:wiggle .35s ease-in-out infinite alternate;cursor:grab;touch-action:none}
.editing .card:nth-child(2n){animation-delay:-.17s}
@keyframes wiggle{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.editing .card.dragging{animation:none;z-index:6;box-shadow:0 1.2em 2.6em rgba(0,0,0,.6);transition:none;border-color:var(--accent)}
.card.drag-over,.app.drag-over{border-color:var(--accent)}
.remove{position:absolute;top:.5em;right:.5em;width:1.9em;height:1.9em;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;z-index:2}
.remove svg{width:1.1em;height:1.1em}
.add-tile{border:.12em dashed var(--line);border-radius:var(--rc);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;font-size:.9em}
.cal-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:.1em;text-align:center;font-size:.72em;flex:1;align-content:space-around}
.cal-mini b{color:var(--muted);font-weight:600}
.cal-mini .tdy{background:var(--accent2);color:var(--on-accent2);border-radius:50%;font-weight:700}
.cal-mini span{display:grid;place-items:center;aspect-ratio:1}
.row2{display:flex;align-items:center;justify-content:space-between;gap:.5em;padding:.3em 0;border-bottom:1px solid var(--line);font-size:.9em;min-width:0}
.row2:last-child{border-bottom:0}
.row2 b{font-variant-numeric:tabular-nums;font-weight:600}
.up{color:#30D158}.dn{color:#FF453A}
.prog{height:.3em;border-radius:.2em;background:var(--line);overflow:hidden;margin-top:auto}
.prog i{display:block;height:100%;background:var(--accent);width:0}

/* ---------- Dock: Nav Bar + Extra Function ---------- */
.dock{position:absolute;left:0;right:0;bottom:1em;display:flex;justify-content:center;align-items:center;gap:.6em;z-index:20;pointer-events:none;transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .4s}
.dock>*{pointer-events:auto}
.m-phone .dock,.m-tablet .dock,.m-desktop .dock{bottom:calc(1em + env(safe-area-inset-bottom,0px))}
html.nodock .dock{transform:translateY(calc(100% + 2em));opacity:0;pointer-events:none}
html.nodock .dock>*{pointer-events:none}
.nav{display:flex;gap:.25em;padding:.35em;border-radius:var(--rn);background:var(--nbg);border:var(--nbd);box-shadow:var(--nsh);backdrop-filter:var(--nbf);-webkit-backdrop-filter:var(--nbf)}
.tab{height:3.1em;padding:0 1em;border-radius:var(--nbb);display:flex;align-items:center;gap:.5em;color:var(--nmu);font-size:.93em;font-weight:500;font-family:var(--font)}
.tab svg{width:1.4em;height:1.4em}
.tab[aria-selected="true"]{background:var(--nab);color:var(--nac)}
.extra{width:3.9em;height:3.9em;border-radius:var(--rx);background:var(--accent2);color:var(--on-accent2);display:grid;place-items:center;box-shadow:0 .6em 1.8em rgba(0,0,0,.28);position:relative;transition:transform .15s;flex:none}
.extra:active{transform:scale(.94)}
.extra svg{width:1.6em;height:1.6em}
.extra .glyph{font-weight:700;font-size:1.1em}
.tip{position:absolute;bottom:4.4em;right:0;white-space:nowrap;font-size:.7em;background:var(--surface-2);border:var(--cb);color:var(--text);padding:.3em .6em;border-radius:.4em;opacity:0;transition:opacity .15s;pointer-events:none}
.extra:hover .tip,.extra:focus-visible .tip{opacity:1}
.m-compact .tip,.m-phone .tip{display:none}
/* classic full-width tab bar for the old-OS themes */
html.fw .dock{bottom:0;gap:0;padding:0}
html.fw .nav{flex:1;border-radius:0;border-width:1px 0 0;justify-content:space-around;padding:.3em .5em calc(.3em + env(safe-area-inset-bottom,0px))}
html.fw .tab{flex:1;justify-content:center}
html.fw .extra{position:absolute;right:.7em;bottom:.5em;width:3em;height:3em;box-shadow:none}
html.fw .view{padding-bottom:6em}

/* ---------- Sheets (widget pages, apps, dialogs) ---------- */
.sheet{position:absolute;inset:0;background:var(--sheetbg);z-index:30;padding:1em 1em .6em;display:flex;flex-direction:column;animation:zoom .2s ease-out;font-family:var(--font);backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
.m-phone .sheet{padding-top:1.6em}.m-tablet .sheet,.m-desktop .sheet{padding:1.6em 1.8em .8em}
.sheet.in-wrap>.sheet-body,.sheet.in-wrap>.sheet-head{width:100%;max-width:56em;margin-left:auto;margin-right:auto}
@keyframes zoom{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.sheet-head{display:flex;align-items:center;gap:.7em;margin-bottom:.8em;flex:none}
.sheet-head h2{margin:0;font-family:var(--hf);font-size:1.4em;font-weight:var(--hw);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;overflow-y:auto;scrollbar-width:none;min-height:0;padding-bottom:.6em}
.icon-btn{width:2.9em;height:2.9em;border-radius:50%;background:var(--surface-2);border:var(--cb);display:grid;place-items:center;flex:none;color:var(--text)}
.icon-btn svg{width:1.3em;height:1.3em}
.icon-btn.acc{color:var(--accent)}
.btn{background:var(--accent);color:var(--on-accent);border-radius:var(--rb);padding:.65em 1.1em;font-weight:700;font-family:var(--font);display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:2.7em}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:.4em .8em;min-height:2em;font-size:.88em}
.btn svg{width:1.2em;height:1.2em}
.link{color:var(--accent);font-weight:600;padding:.3em .4em;border-radius:.4em}
.fi{width:100%;background:var(--surface-2);border:0;border-radius:var(--ri);padding:.7em .9em;font-weight:500;outline:0;font-family:var(--font);min-height:2.7em;min-width:0}
.fi::placeholder{color:var(--muted)}
.fi[type=time],.fi[type=date],.fi[type=datetime-local]{color-scheme:inherit}
.frow{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.frow .fi{flex:1 1 7em}
.lab{font-size:.78em;font-weight:600;color:var(--muted);margin:1em .3em .4em;text-transform:var(--ht);letter-spacing:var(--hl)}
.note{font-size:.85em;color:var(--muted);margin:.5em .3em}
.grp{background:var(--surface);border:var(--cb);box-shadow:var(--csh);border-radius:var(--rc);overflow:hidden;backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf);margin-bottom:.8em}
.grp.pad{padding:1em}
.lr{display:flex;align-items:center;gap:.8em;width:100%;border-bottom:1px solid var(--line);padding:.75em 1em;min-height:3.2em;text-align:left;min-width:0}
.lr:last-child{border-bottom:0}
.lr .tx{flex:1;min-width:0}
.lr .tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .tx small{display:block;color:var(--muted);font-size:.82em;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .val{color:var(--muted);font-size:.9em;white-space:nowrap}
.lr .ck{color:var(--accent);font-weight:700}
.lr svg.i{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:1.4em .5em;font-size:.93em}
.seg{display:flex;gap:.25em;background:var(--surface-2);border-radius:var(--rb);padding:.25em;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border-radius:var(--rb);padding:.5em .8em;font-weight:600;font-size:.9em;text-align:center;white-space:nowrap;min-height:2.4em;color:var(--muted)}
.seg button[aria-checked=true],.seg button[aria-selected=true]{background:var(--accent);color:var(--on-accent)}
.seg button:disabled{opacity:.4}
.chips{display:flex;gap:.5em;overflow-x:auto;padding:.1em .1em .6em;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:.4em .85em;background:var(--surface-2);font-weight:600;font-size:.85em;display:inline-flex;gap:.4em;align-items:center;white-space:nowrap}
.chip small{color:var(--muted);font-weight:600}
.chip.on{background:var(--accent);color:var(--on-accent)}.chip.on small{color:inherit;opacity:.8}
.sw{position:relative;width:3em;height:1.8em;border-radius:999px;background:var(--line);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:.2em;left:.2em;width:1.4em;height:1.4em;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true]::after{transform:translateX(1.2em)}
.row-acts{display:flex;gap:.4em;align-items:center}
.x{color:var(--muted);padding:.3em .6em;border-radius:.5em;font-size:1.2em;line-height:1}

/* ---------- Popovers / menus ---------- */
.popover{position:absolute;z-index:40;width:17em;background:var(--sheetbg);border:var(--cb);border-radius:1.2em;padding:.4em;box-shadow:0 1.4em 3.4em rgba(0,0,0,.6);animation:zoom .15s ease-out;backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf);max-height:70%;overflow-y:auto}
.opt{width:100%;display:flex;align-items:center;gap:.8em;padding:.65em;border-radius:.85em;text-align:left;font-size:.93em;min-height:3em}
.opt:hover,.opt:focus-visible{background:var(--surface-2)}
.opt small{display:block;color:var(--muted);font-size:.85em}
.opt .g{width:2.1em;height:2.1em;border-radius:.65em;display:grid;place-items:center;font-weight:700;font-size:.9em;color:#0c0c0e;flex:none}
.opt .check{margin-left:auto;color:var(--accent)}
.opt .check svg{width:1.2em;height:1.2em}

/* ---------- Dialogs ---------- */
#modal{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:.8em;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#modal.on{display:flex}#modal.as{align-items:flex-end}
.alert{width:min(100%,21em);background:var(--sheetbg);color:var(--text);border-radius:1.3em;padding:1.1em;text-align:center;border:var(--cb);display:flex;flex-direction:column;gap:.6em;backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf);font-family:var(--font);max-height:100%;overflow:auto}
.alert p{margin:0;color:var(--muted);font-size:.9em}
.ab{display:flex;gap:.5em;margin-top:.4em}
.ab button{flex:1;border-radius:.9em;padding:.7em;font-weight:600;background:var(--surface-2);min-height:2.8em;text-align:center}
.ab button.pri{background:var(--accent);color:var(--on-accent)}
.ab button.dng{background:var(--danger);color:#fff}
.asheet{width:min(100%,28em);display:flex;flex-direction:column;gap:.5em;max-height:100%;overflow:auto}
.asg{background:var(--sheetbg);border:var(--cb);border-radius:1.2em;overflow:hidden;backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
.asg button{display:flex;align-items:center;gap:.7em;width:100%;border-bottom:1px solid var(--line);padding:.85em 1.1em;font-weight:500;text-align:left;min-height:3em}
.asg button:last-child{border-bottom:0}
.asg button.dng{color:var(--danger)}
.ast{text-align:center;color:var(--muted);font-size:.8em;padding:.2em}
.toast{position:absolute;left:50%;bottom:6.6em;transform:translateX(-50%) translateY(.6em);background:var(--sheetbg);border:var(--cb);padding:.65em 1.1em;border-radius:1.2em;font-size:.9em;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;text-align:center;box-shadow:0 .6em 1.8em rgba(0,0,0,.35);backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast b{display:block}
.ring-alert{position:absolute;inset:0;z-index:90;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:1em}
.ring-alert .alert{animation:pulse2 1s ease-in-out infinite alternate}
@keyframes pulse2{to{transform:scale(1.03)}}

/* ---------- Clock ---------- */
.dig{font-family:var(--tf);font-weight:var(--tw);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tabs{display:flex;gap:.25em;background:var(--surface-2);border-radius:var(--rb);padding:.25em;margin-bottom:.8em;flex:none;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:.1em;border-radius:var(--rb);padding:.4em .7em;font-size:.78em;font-weight:600;color:var(--muted);min-width:4.2em}
.tabs button svg{width:1.5em;height:1.5em}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--on-accent)}
.wcr{display:flex;align-items:center;gap:.8em;padding:.8em 1em;border-bottom:1px solid var(--line)}
.wcr:last-child{border-bottom:0}
.wcr .tx{flex:1;min-width:0}.wcr .tx small{color:var(--muted);display:block;font-size:.8em}
.wcr .dig{font-size:2em}
.alr .dig{font-size:2.2em}
.alr.off .dig,.alr.off .tx{opacity:.5}
.days{display:flex;gap:.3em;flex-wrap:wrap}
.days button{width:2.4em;height:2.4em;border-radius:50%;background:var(--surface-2);font-weight:600;font-size:.85em;display:grid;place-items:center}
.days button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.swbig{font-size:min(4.4em,17cqw);text-align:center;margin:.3em 0 .5em}
.cbtns{display:flex;justify-content:space-around;margin:.6em 0 1em}
.cbtn{width:5em;height:5em;border-radius:50%;font-weight:700;display:grid;place-items:center;background:var(--surface-2);border:.2em solid var(--sheetbg);outline:1px solid var(--line);text-align:center}
.cbtn.go{background:var(--accent);color:var(--on-accent);outline-color:var(--accent)}
.cbtn.stop{background:var(--danger);color:#fff;outline-color:var(--danger)}
.cbtn:disabled{opacity:.4}
.ringw{position:relative;width:min(16em,70%);aspect-ratio:1;margin:.3em auto .8em}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:6}
.ringw .bg{stroke:var(--surface-2)}.ringw .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ringw .mid2{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringw .mid2 .dig{font-size:2.8em}
.tpick{display:flex;justify-content:center;gap:.4em;align-items:center;margin:.6em 0}
.tpick label{display:flex;flex-direction:column;align-items:center;font-size:.75em;color:var(--muted);gap:.2em}
.tpick input{width:4.2em;font-size:2em;text-align:center;background:var(--surface-2);border:0;border-radius:var(--ri);padding:.2em 0;font-family:var(--tf);outline:0}
.lap{display:flex;justify-content:space-between;padding:.55em .3em;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lap.best{color:#30D158}.lap.worst{color:#FF453A}
.cdr .big2{font-size:1.5em;font-weight:var(--tw);font-family:var(--tf);font-variant-numeric:tabular-nums}

/* ---------- Weather ---------- */
.wxh{text-align:center;padding:.4em 0 1em}
.wxh .ico svg{width:6em;height:6em}
.wxh .town{font-size:1.2em;font-weight:600}
.wxh .deg{font-family:var(--tf);font-size:4.6em;font-weight:var(--tw);line-height:1;letter-spacing:-.03em;margin:.05em 0}
.wxh .cond{font-size:1.1em;font-weight:600}
.hr{display:flex;gap:.2em;overflow-x:auto;scrollbar-width:none;padding:.4em .2em}
.hr::-webkit-scrollbar{display:none}
.hr .h1{flex:none;min-width:3.7em;display:flex;flex-direction:column;align-items:center;gap:.25em;font-size:.82em}
.hr .h1 .ico svg{width:2.2em;height:2.2em}
.hr .h1 .p{color:var(--rain);font-size:.85em;min-height:1.1em;font-weight:600}
.dr{display:grid;grid-template-columns:3.4em 2.2em 2.6em 1fr 2.6em;align-items:center;gap:.5em;padding:.5em 1em;border-bottom:1px solid var(--line);font-size:.93em}
.dr:last-child{border-bottom:0}
.dr .ico svg{width:1.9em;height:1.9em}
.dr .lo{color:var(--muted);text-align:right}
.dr .rng{height:.35em;border-radius:.3em;background:var(--surface-2);position:relative}
.dr .rng i{position:absolute;top:0;bottom:0;border-radius:.3em;background:linear-gradient(90deg,var(--rain),var(--sun))}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:.6em}
.m-tablet .tiles,.m-desktop .tiles{grid-template-columns:repeat(3,1fr)}
.tile2{background:var(--surface);border:var(--cb);box-shadow:var(--csh);border-radius:var(--rc);padding:.9em;display:flex;flex-direction:column;gap:.3em;backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf);min-height:6.4em}
.tile2 .v{font-family:var(--tf);font-size:1.7em;font-weight:var(--tw);line-height:1.1}
.tile2 .d{font-size:.8em;color:var(--muted);margin-top:auto}
.ico.sm svg{width:2.1em;height:2.1em}
.ico.big svg{width:5.2em;height:5.2em}
.ico svg{display:block}
.still *{animation:none!important}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.cl{animation:drift 6s ease-in-out infinite alternate}
.drop{animation:fall 1.2s linear infinite}.flake{animation:fall 2.4s linear infinite}
.bolt{animation:flash 3s infinite}.fg2{animation:slide 4s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translateX(3px)}}
@keyframes fall{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(8px);opacity:0}}
@keyframes flash{0%,60%,100%{opacity:.3}65%,75%{opacity:1}70%{opacity:.35}}
@keyframes slide{to{transform:translateX(4px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Calendar / schedule ---------- */
.mhead{display:flex;align-items:center;justify-content:space-between;margin:.2em .2em .6em}
.mhead h3{margin:0;font-size:1.15em;font-family:var(--hf)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:.2em;text-align:center}
.mgrid b{color:var(--muted);font-size:.75em;font-weight:600;padding:.3em 0}
.mgrid button{aspect-ratio:1;max-height:3.4em;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;font-size:.95em;position:relative;margin:auto}
.mgrid button.out{color:var(--muted);opacity:.5}
.mgrid button.tdy{color:var(--accent);font-weight:700}
.mgrid button.sel{background:var(--accent2);color:var(--on-accent2);font-weight:700}
.mgrid button .dot{position:absolute;bottom:.25em;width:.3em;height:.3em;border-radius:50%;background:var(--accent)}
.mgrid button.sel .dot{background:var(--on-accent2)}
.evr{display:flex;gap:.8em;padding:.75em 1em;border-bottom:1px solid var(--line);align-items:center;text-align:left;width:100%}
.evr:last-child{border-bottom:0}
.evr .bar{width:.3em;align-self:stretch;border-radius:.3em;flex:none}
.evr .tm{min-width:4.6em;color:var(--muted);font-size:.85em;font-variant-numeric:tabular-nums}
.evr .tx{flex:1;min-width:0}.evr .tx b{display:block;font-weight:600}
.evr .tx small{color:var(--muted)}
.evr.past{opacity:.5}.evr.now{background:var(--surface-2)}
.colors{display:flex;gap:.5em;flex-wrap:wrap}
.colors button{width:2.2em;height:2.2em;border-radius:50%;border:.15em solid transparent;outline:1px solid var(--line)}
.colors button[aria-pressed=true]{border-color:var(--bg);outline:.2em solid var(--accent)}
.dayrow{display:flex;gap:.3em;overflow-x:auto;padding:.2em 0 .6em;scrollbar-width:none}
.dayrow::-webkit-scrollbar{display:none}
.dayrow button{flex:none;width:3.4em;padding:.4em 0;border-radius:var(--ri);background:var(--surface);border:var(--cb);display:flex;flex-direction:column;align-items:center;font-size:.85em;gap:.1em}
.dayrow button small{color:var(--muted);font-size:.8em}
.dayrow button[aria-pressed=true]{background:var(--accent2);color:var(--on-accent2)}
.dayrow button[aria-pressed=true] small{color:inherit}
.trow{display:flex;align-items:center;gap:.8em;padding:.7em 1em;border-bottom:1px solid var(--line);width:100%;text-align:left}
.trow:last-child{border-bottom:0}
.trow .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.trow .tx small{display:block;color:var(--muted);font-size:.8em}
.trow .tx small.od{color:var(--danger)}

/* ---------- Notes ---------- */
.nr{display:block;width:100%;text-align:left;padding:.7em 1em;min-width:0}
.nr b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr span{display:block;color:var(--muted);font-size:.87em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrw{border-bottom:1px solid var(--line)}.nrw:last-child{border-bottom:0}
.gl{font-size:.78em;font-weight:600;color:var(--muted);margin:.7em .5em .35em;text-transform:var(--ht)}
.cnt{text-align:center;color:var(--muted);font-size:.85em;padding:.4em}
.search{display:flex;align-items:center;gap:.5em;background:var(--surface-2);border-radius:var(--ri);padding:0 .8em;height:2.7em;margin-bottom:.6em}
.search svg{width:1.15em;height:1.15em;color:var(--muted)}
.search input{background:none;border:0;outline:0;flex:1;min-width:0}
.ned{display:flex;flex-direction:column;height:100%;min-height:0}
.et{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4em;gap:.5em;flex:none}
.eb{display:flex;gap:.4em;align-items:center}
.ew{color:var(--muted);font-size:.8em;text-align:center;margin-bottom:.5em;flex:none}
#nta{flex:1;width:100%;background:transparent;border:0;outline:0;resize:none;font-size:1.05em;line-height:1.55;font-family:var(--font);color:var(--text);padding:0;min-height:0}
.dict{display:inline-flex;align-items:center;gap:.4em;min-height:2.6em;padding:0 .9em;border-radius:999px;background:var(--surface-2);font-size:.9em}
.dict svg{width:1.2em;height:1.2em}
.dict.live{background:var(--danger);color:#1a0505}
.ndl{margin:.3em 0 0;color:var(--accent);flex:none}

/* ---------- AI ---------- */
.chat{display:flex;flex-direction:column;height:100%;gap:.7em}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.6em;padding:.2em;min-height:0;scrollbar-width:none}
.msg{max-width:84%;padding:.6em .9em;border-radius:1.2em;font-size:.93em;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:.35em}
.msg.ai{align-self:flex-start;background:var(--surface);border:var(--cb);border-bottom-left-radius:.35em}
.msg.err{border-color:var(--danger);color:var(--danger)}
.msg.live{border:1px dashed var(--danger)}
.msg .by{font-size:.75em;color:var(--muted);display:flex;align-items:center;gap:.3em;margin-bottom:.15em}
.msg.user .by{color:inherit;opacity:.75}
.msg .by svg{width:1em;height:1em}
.divider{align-self:center;font-size:.75em;color:var(--muted);background:var(--surface);border:var(--cb);padding:.2em .7em;border-radius:999px}
.composer{display:flex;align-items:center;gap:.5em;background:var(--surface);border:var(--cb);border-radius:var(--rb);padding:.4em .4em .4em .6em;flex:none;box-shadow:var(--csh);backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
.chip.m{background:var(--surface-2)}
.dot{width:.55em;height:.55em;border-radius:50%;display:inline-block}
.composer input{flex:1;background:none;border:0;outline:0;min-width:0}
.send,.cbtn2{width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;flex:none}
.send{background:var(--accent);color:var(--on-accent)}.cbtn2{background:var(--surface-2)}
.send svg,.cbtn2 svg{width:1.2em;height:1.2em}
.cbtn2.live{background:var(--danger);color:#1a0505;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}50%{box-shadow:0 0 0 .5em rgba(248,113,113,0)}}
.suggest{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center}
.suggest button{font-size:.88em;padding:.5em .8em;border-radius:999px;border:var(--cb);background:var(--surface)}
.aiempty{margin:auto;text-align:center;color:var(--muted);font-size:.93em;display:flex;flex-direction:column;gap:.8em;align-items:center;padding:.5em;width:100%}
.aiempty .g{width:3.4em;height:3.4em;border-radius:1.1em;display:grid;place-items:center;font-weight:700;font-size:1.3em;color:#0c0c0e}
.aiempty b{color:var(--text);font-size:1.15em}
.keyc{width:100%;text-align:left}
.ai-top{display:flex;align-items:center;justify-content:space-between;gap:.5em;flex:none}
.hint{font-size:.78em;color:var(--muted)}
.voicebar{display:grid;grid-template-columns:1fr 1fr 3.6em;gap:.6em;flex:none}
.vbtn{height:7em;border-radius:1.5em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;font-size:1.1em;font-weight:600;transition:transform .15s}
.vbtn:active{transform:scale(.97)}
.vbtn svg{width:2.1em;height:2.1em;margin-bottom:.1em}
.vbtn small{font-size:.75em;font-weight:500;opacity:.75}
.vbtn.talk{background:var(--accent);color:var(--on-accent)}
.vbtn.talk.live{background:var(--danger);color:#1a0505;animation:pulse 1.2s ease-in-out infinite}
.vbtn.vchat{background:var(--surface-2);border:var(--cb)}
.vkb{border-radius:1.3em;background:var(--surface);border:var(--cb);display:grid;place-items:center}
.vkb svg{width:1.6em;height:1.6em}
.vc .sheet-head{justify-content:space-between}
.vc-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;text-align:center}
.orb{width:9em;height:9em;border-radius:50%;position:relative;flex:none}
.orb span{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55) 0,var(--c) 38%,color-mix(in srgb,var(--c) 35%,#000) 100%);box-shadow:0 0 4em color-mix(in srgb,var(--c) 45%,transparent)}
.orb.listening span{animation:breathe 1.8s ease-in-out infinite}.orb.thinking span{animation:think .9s ease-in-out infinite}.orb.speaking span{animation:speak .38s ease-in-out infinite alternate}
.orb.muted span{filter:grayscale(1) brightness(.55);box-shadow:none}
@keyframes breathe{50%{transform:scale(1.06)}}@keyframes think{50%{transform:scale(.9);opacity:.7}}@keyframes speak{from{transform:scale(1)}to{transform:scale(1.12)}}
.vc-status{font-size:1.3em;font-weight:600;margin:.2em 0 0}
.vc-heard{font-size:.95em;color:var(--muted);margin:0;min-height:1.5em;max-width:92%}
.vc-reply{margin:0;max-width:92%;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vc-ctrl{display:flex;justify-content:center;gap:1.8em;flex:none}
.vc-b{display:flex;flex-direction:column;align-items:center;gap:.4em;font-size:.85em;color:var(--muted)}
.vc-b .ring{width:4.2em;height:4.2em;border-radius:50%;background:var(--surface-2);border:var(--cb);display:grid;place-items:center;color:var(--text)}
.vc-b .ring svg{width:1.7em;height:1.7em}
.vc-b[aria-pressed="true"] .ring{background:var(--text);color:var(--bg)}
.vc-b.end .ring{background:var(--danger);color:#1a0505;border-color:transparent}

/* ---------- Profile + app icons ---------- */
.profile-top{display:flex;align-items:center;gap:1em;background:var(--surface);border:var(--cb);box-shadow:var(--csh);border-radius:var(--rc);padding:1em;margin-bottom:1em;backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
.profile-top>div:last-child{min-width:0;flex:1}
.avatar{width:4.4em;height:4.4em;border-radius:50%;display:grid;place-items:center;font-size:1.6em;font-weight:700;color:#0c0c0e;position:relative;flex:none;background:var(--accent) center/cover;background-clip:padding-box}
.avatar .cam{position:absolute;right:-.1em;bottom:-.1em;width:1.6em;height:1.6em;border-radius:50%;background:var(--surface-2);border:var(--cb);display:grid;place-items:center;color:var(--text)}
.avatar .cam svg{width:.9em;height:.9em}
.pname{font-size:1.35em;font-weight:var(--hw);font-family:var(--hf);overflow:hidden;text-overflow:ellipsis}
.pname-input{font-size:1.3em;font-weight:600;background:var(--surface-2);border:0;border-radius:var(--ri);padding:.15em .5em;width:100%;outline:0;font-family:var(--hf)}
.accounts{display:flex;gap:.4em;margin-top:.5em;flex-wrap:wrap}
.section-t{font-size:.78em;color:var(--muted);text-transform:var(--ht);letter-spacing:var(--hl);margin:0 .3em .6em;font-weight:600}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:.9em .4em}
.m-phone .apps{grid-template-columns:repeat(4,1fr)}
.m-tablet .apps{grid-template-columns:repeat(7,1fr)}.m-desktop .apps{grid-template-columns:repeat(8,1fr)}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:.5em;font-size:.82em;padding:.4em 0;border-radius:.9em;text-align:center;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;min-width:0}
.app>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apps.edit .app{touch-action:none}
.apps.edit .app .ic{animation:wig .26s ease-in-out infinite alternate}
.app.dragging .ic{animation:none}.app.dragging{z-index:6;transition:none}
@keyframes wig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.app .remove{top:-.1em;right:calc(50% - 3.1em);width:1.7em;height:1.7em}
.ic{position:relative;width:4.2em;height:4.2em;border-radius:22%;display:grid;place-items:center;background:linear-gradient(160deg,var(--c1,var(--surface-2)),var(--c2,var(--surface-2)));color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);flex:none}
.ic svg{width:2.1em;height:2.1em}
.m-compact .ic{width:4.5em;height:4.5em}
.ic[data-ic=glass]{background:linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.1)),linear-gradient(160deg,var(--c1),var(--c2));opacity:.92;box-shadow:inset 1px 1px 0 rgba(255,255,255,.75),inset 0 0 0 1px rgba(255,255,255,.3),0 8px 18px rgba(0,0,0,.2)}
.ic[data-ic=ios6]{border-radius:18%;background:linear-gradient(180deg,rgba(255,255,255,.55) 0 48%,rgba(255,255,255,0) 50%),linear-gradient(var(--c1),var(--c2));box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.8),0 2px 4px rgba(0,0,0,.5)}
.ic[data-ic=ios6] svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
.ic[data-ic=tonal]{border-radius:34%;background:var(--surface-2);color:var(--accent);box-shadow:none}
.ic[data-ic=flat]{border-radius:50%;background:var(--c1);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.ic[data-ic=holo]{border-radius:0;background:none;box-shadow:none;color:var(--c1)}
.ic[data-ic=holo] svg{width:2.9em;height:2.9em}
.ic[data-ic=mono]{background:none;box-shadow:none;border:1.5px solid var(--text);color:var(--text);border-radius:.9em}
.ic[data-ic=dots]{border-radius:50%;background:var(--bg) radial-gradient(circle,var(--line) 1px,transparent 1.4px) 0 0/6px 6px;box-shadow:inset 0 0 0 1px var(--line);color:var(--text)}
.ic[data-ic=dots]::after{content:"";position:absolute;top:.3em;right:.3em;width:.45em;height:.45em;border-radius:50%;background:#D71921}
.ic[data-ic=ink]{border-radius:0;background:none;border:2px solid var(--text);color:var(--text);box-shadow:3px 3px 0 var(--text)}
.app.addt .ic{background:none;border:.15em dashed var(--line);color:var(--muted);box-shadow:none;opacity:1}

/* ---------- Theme app ---------- */
.tpv{border-radius:1.2em;padding:.8em;background:var(--bg);color:var(--text);font-family:var(--font);border:1px solid var(--line);overflow:hidden;position:relative;flex:none;margin-bottom:.7em}
.tpv .row{display:flex;gap:.5em;align-items:stretch}
.tpv .c{flex:1;background:var(--surface);border:var(--cb);box-shadow:var(--csh);border-radius:var(--rc);padding:.5em .7em;min-width:0;backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
.tpv .c small{display:block;font-family:var(--hf);font-size:.7em;text-transform:var(--ht);letter-spacing:var(--hl);color:var(--hc);font-weight:var(--hw)}
.tpv .c strong{display:block;font-family:var(--tf);font-weight:var(--tw);font-size:1.7em;line-height:1.1;letter-spacing:-.02em}
.tpv .c em{display:block;height:.28em;width:60%;border-radius:2px;background:var(--accent);margin-top:.35em}
.tpv .c .t2{font-size:.8em;color:var(--muted)}
.tpv .icons{display:flex;gap:.5em;margin-top:.6em;align-items:center}
.tpv .icons .ic{width:2.5em;height:2.5em}.tpv .icons .ic svg{width:1.25em;height:1.25em}
.tpv .nvp{margin-left:auto;display:flex;gap:.2em;padding:.2em;border-radius:var(--rn);background:var(--nbg);border:var(--nbd);box-shadow:var(--nsh);backdrop-filter:var(--nbf)}
.tpv .nvp i{width:1.5em;height:1.5em;border-radius:var(--nbb);background:var(--nab);display:block}
.tpv .nvp i+i{background:none;border:.12em solid var(--nmu);opacity:.6;border-radius:50%;width:.9em;height:.9em;margin:.3em .3em}
.tpv .ex{width:2em;height:2em;border-radius:var(--rx);background:var(--accent2);display:block;flex:none}
.topts{display:grid;grid-template-columns:repeat(auto-fill,minmax(9em,1fr));gap:.6em}
.topt{border:.15em solid transparent;border-radius:1.1em;padding:.3em;text-align:left;font-weight:600;font-size:.9em}
.topt[aria-checked=true]{border-color:var(--accent)}
.topt>span{display:block;padding:.4em .2em 0}
.topt .tpv{margin:0;padding:.5em}
.topt .tpv .c strong{font-size:1.1em}
.topt .ipv{display:flex;gap:.35em;justify-content:center;align-items:center;padding:.6em .3em;background:var(--bg);border-radius:.8em;height:4.4em;border:1px solid var(--line)}
.topt .ipv .ic{width:2.2em;height:2.2em}.topt .ipv .ic svg{width:1.1em;height:1.1em}
.topt .ic[data-ic=holo] svg{width:1.7em;height:1.7em}
.fontopt{display:flex;align-items:center;gap:.8em;width:100%;padding:.75em 1em;border-bottom:1px solid var(--line);text-align:left}
.fontopt:last-child{border-bottom:0}
.fontopt .smp{font-size:1.6em;width:1.9em;text-align:center;flex:none;line-height:1}
.fontopt .tx{flex:1;min-width:0}
.fontopt .tx b{display:block;font-size:1em}.fontopt .tx small{color:var(--muted);font-size:.8em}
.fontopt .badge{font-size:.7em;background:var(--surface-2);border-radius:999px;padding:.15em .6em;color:var(--muted);font-weight:600}
.sws{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}
.sws button{width:2.4em;height:2.4em;border-radius:50%;border:.15em solid transparent;outline:1px solid var(--line);position:relative}
.sws button[aria-pressed=true]{border-color:var(--bg);outline:.2em solid var(--text)}
.sws input[type=color]{width:2.4em;height:2.4em;padding:0;border:0;border-radius:50%;background:none;overflow:hidden}

/* ---------- Music / files ---------- */
.mplay{text-align:center;padding:1em}
.mplay .cover{width:min(11em,50%);aspect-ratio:1;margin:0 auto .8em;border-radius:1.2em;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:var(--on-accent)}
.mplay .cover svg{width:40%;height:40%}
.mplay .ttl{font-weight:700;font-size:1.1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mctl{display:flex;gap:1.2em;justify-content:center;align-items:center;margin-top:.8em}
.mctl .icon-btn.big{width:4em;height:4em;background:var(--accent);color:var(--on-accent)}
.fthumb{width:2.6em;height:2.6em;border-radius:.6em;background:var(--surface-2) center/cover;display:grid;place-items:center;flex:none;color:var(--muted)}

/* ---------- Per-theme structure ---------- */
html[data-theme=glass] .device::before{background:radial-gradient(55vmax 55vmax at 12% 8%,rgba(255,255,255,.3),transparent 60%),radial-gradient(45vmax 45vmax at 92% 85%,rgba(140,200,255,.25),transparent 60%),radial-gradient(35vmax 35vmax at 70% 20%,rgba(255,170,220,.14),transparent 60%)}
html[data-theme=glass] .device{text-shadow:0 1px 3px rgba(0,0,0,.18)}
html[data-theme=glass] .card::after,html[data-theme=glass] .grp::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 34%)}
html[data-theme=glass] .grp{position:relative}
html[data-theme=glass] .btn,html[data-theme=glass] .send{background:rgba(255,255,255,.22);color:#fff;text-shadow:none;box-shadow:inset 1px 1px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.22),0 4px 14px rgba(0,0,0,.12)}
html[data-theme=glass] .extra{background:rgba(255,255,255,.28);color:#fff;box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.22),0 8px 22px rgba(8,25,70,.25);backdrop-filter:blur(14px) saturate(180%)}
html[data-theme=glass] .msg.user,html[data-theme=glass] .seg button[aria-checked=true],html[data-theme=glass] .tabs button[aria-selected=true],html[data-theme=glass] .chip.on,html[data-theme=glass] .days button[aria-pressed=true]{background:rgba(255,255,255,.32);color:#fff}
html[data-theme=glass] .fi{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
html[data-theme=glass] .sw[aria-checked=true]{background:rgba(255,255,255,.55)}
html[data-theme=minimal] .card{border:0;border-top:1px solid var(--line);padding:1em .3em;background:none}
html[data-theme=minimal] .btn{background:transparent;color:var(--text);border:1px solid var(--text)}
html[data-theme=minimal] .msg.user{border:1px solid var(--text);background:none;color:var(--text)}
html[data-theme=nothing] .card{background-image:radial-gradient(circle,var(--line) 1px,transparent 1.3px);background-size:14px 14px}
html[data-theme=nothing] .label>span:first-child::before,html[data-theme=nothing] .label:not(:has(svg))::before{content:"";display:inline-block;width:.45em;height:.45em;border-radius:50%;background:var(--accent);margin-right:.3em}
html[data-theme=nothing] .prog{height:.4em;background:radial-gradient(circle,var(--line) 1.4px,transparent 1.9px) 0 0/8px 8px}
html[data-theme=nothing] .prog i{background:radial-gradient(circle,var(--accent) 1.4px,transparent 1.9px) 0 0/8px 8px}
html[data-theme=news] .view{border-top:.28em double var(--text);margin:.6em .6em 0;padding:.9em .8em 6.6em;inset:0}
html[data-theme=news] .card{border:0;border-bottom:1px solid var(--text);padding:.9em 1em}
html[data-theme=news] .label{justify-content:center;border-top:1px solid var(--text);border-bottom:1px solid var(--text);padding:.2em 0;color:var(--text)}
html[data-theme=news] .btn{text-transform:uppercase;letter-spacing:.08em;font-size:.78em}
html[data-theme=news] .head p{font-style:italic}
html[data-theme=ios6] .label{color:var(--muted)}
html[data-theme=ios6] .btn,html[data-theme=ios6] .send{background:linear-gradient(#6EA4EC,#2F6FD6 50%,#1D5BC4 51%,#3A80E6);border:1px solid #1B4FA8;text-shadow:0 -1px 0 rgba(0,0,0,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);color:#fff}
html[data-theme=ios6] .btn.ghost{background:linear-gradient(#fff,#d9d9d9);color:#333;text-shadow:none;border-color:#999}
html[data-theme=ios6][data-mode=dark] .btn.ghost{background:linear-gradient(#5a5f6a,#3a3f49);color:#fff;border-color:#222}
html[data-theme=ios6] .fi,html[data-theme=ios6] .search{background:#fff;color:#000;border:1px solid #B3B3B3;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
html[data-theme=ios6][data-mode=dark] .fi,html[data-theme=ios6][data-mode=dark] .search{background:#23262C;color:#fff;border-color:#14161A}
html[data-theme=ios6] .extra{background:linear-gradient(#6EA4EC,#2F6FD6 50%,#1D5BC4 51%,#3A80E6);color:#fff;border-radius:.6em}
html[data-theme=ios6] [data-w=weather]{background:linear-gradient(#5E94CC,#2C5E9E);border-color:#1B3F70;--text:#fff;--muted:rgba(255,255,255,.82);--line:rgba(255,255,255,.28);--cloud:#E8EEF5;--sun:#FFD84A;--rain:#CFE3FF;--moon:#fff;--snow:#fff;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
html[data-theme=ios6] [data-w=clock]{background:linear-gradient(#34383F,#06070A);border-color:#000;--text:#fff;--muted:#B4BBC8;--line:#4A505B;color:#fff;text-shadow:0 1px 0 #000}
html[data-theme=ios6] .tab{font-size:.8em;flex-direction:column;height:3.4em;gap:.1em;justify-content:center}
html[data-theme=ios6] .tab span{display:block;font-size:.85em}
html[data-theme=ios6] .nr,html[data-theme=ios6] #nta{font-family:"Marker Felt","Noteworthy","Chalkboard SE","Comic Sans MS",cursive}
html[data-theme=ios6] .pad-notes{background:#FBF3A6;border:1px solid #CBBE62;border-radius:.3em;box-shadow:0 2px 5px rgba(0,0,0,.35),inset 0 0 30px rgba(190,160,40,.15);color:#2B2208;--text:#2B2208;--muted:#7A6A28;--line:rgba(70,110,170,.4)}
html[data-theme=ios6] .pad-notes .nr b{color:#2B2208}
html[data-theme=ios6] .ned.pad{background:#FBF3A6 repeating-linear-gradient(transparent 0 calc(1.7em - 1px),rgba(70,110,170,.4) calc(1.7em - 1px) 1.7em);border:1px solid #CBBE62;border-radius:.3em;padding:.4em 1em .5em 2.6em;color:#2B2208;--text:#2B2208;--muted:#7A6A28}
html[data-theme=ios6] .ned.pad #nta{line-height:1.7em;color:#2B2208}
html[data-theme=android4] .label{border-bottom:2px solid var(--accent);padding-bottom:.25em}
html[data-theme=android4] .btn{background:transparent;color:var(--text);border:1px solid var(--line)}
html[data-theme=android4] .tab[aria-selected=true]{box-shadow:inset 0 -3px 0 var(--accent)}
html[data-theme=material] .btn{text-transform:uppercase;letter-spacing:.04em;font-size:.82em;box-shadow:0 2px 2px rgba(0,0,0,.24)}
/* ===== v3.1 additions ===== */
html,body{-webkit-text-size-adjust:100%}
.view,.sheet-body,.cv,.msgs{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view,.sheet-body{scroll-behavior:smooth}
button{-webkit-tap-highlight-color:transparent}
.view{transition:transform .46s cubic-bezier(.32,.72,0,1),opacity .46s cubic-bezier(.32,.72,0,1)}
html.sheeted .view{transform:translateX(-24%);opacity:.5}
.view.cvmode{padding:0;overflow:hidden}
.grid{grid-auto-flow:dense}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu{color:var(--muted)}
/* --- transitions --- */
.sheet{animation:none}
.sheet.enter{animation:sheetIn .46s cubic-bezier(.32,.72,0,1) both}
.sheet.leave{animation:sheetOut .4s cubic-bezier(.32,.72,0,1) both;pointer-events:none;z-index:31}
@keyframes sheetIn{from{transform:translateX(100%);box-shadow:-1.2em 0 2.4em rgba(0,0,0,.35)}to{transform:none;box-shadow:none}}
@keyframes sheetOut{from{transform:none}to{transform:translateX(100%);box-shadow:-1.2em 0 2.4em rgba(0,0,0,.35)}}
.pg-r{animation:pgR .46s cubic-bezier(.32,.72,0,1) both}.pg-l{animation:pgL .46s cubic-bezier(.32,.72,0,1) both}.pg-f{animation:pgF .34s ease-out both}
@keyframes pgR{from{opacity:0;transform:translateX(16%)}to{opacity:1;transform:none}}

/* battery */
S.batt = null;
function initBattery() {
  window.__battery = (l, c) => { S.batt = { l: Math.round(l), c: !!c }; softRender(); };
  if (!navigator.getBattery) { if (window.AndroidApp && AndroidApp.getBattery) { const p = () => { try { const [l, c] = String(AndroidApp.getBattery()).split(","); if (l !== "" && l != null) { const n = { l: Math.round(+l), c: c === "1" || c === "true" }; if (!S.batt || S.batt.l !== n.l || S.batt.c !== n.c) { S.batt = n; softRender(); } } } catch {} }; p(); setInterval(p, 20000); } return; } navigator.getBattery().then((b) => { const u = () => { S.batt = { l: Math.round(b.level * 100), c: b.charging }; softRender(); }; u(); b.addEventListener("levelchange", u); b.addEventListener("chargingchange", u); }).catch(() => {}); }
function batterySvg(l, ch, cls = "") {
  const col = ch ? "#30D158" : l <= 20 ? "#FF453A" : "var(--text)", w = Math.max(2, 36 * l / 100);
  return `<svg class="batt ${cls}" viewBox="0 0 54 26" aria-hidden="true"><rect x="1" y="1" width="46" height="24" rx="7" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="2"/><path d="M50 9v8" stroke="currentColor" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/><rect x="5.5" y="5.5" width="${w}" height="15" rx="4" fill="${col}"/>${ch ? `<path d="M25.5 5.5 18.5 14.5h5l-1.5 6 7-9h-5z" fill="#fff" stroke="#14301c" stroke-width=".8" stroke-linejoin="round"/>` : ""}</svg>`;
}

}

/* push reminders to the Android wrapper so they fire when the app is closed */
function syncNative() {
  if (!window.AndroidApp || !AndroidApp.setReminders) return; const out = [], now = Date.now();
  P.alarms.filter((a) => a.on).forEach((a) => { for (let d = 0; d < 8; d++) { const x = new Date(); x.setDate(x.getDate() + d); x.setHours(a.h, a.m, 0, 0); if (+x > now && (!a.days.length || a.days.includes(x.getDay()))) { out.push({ id: "al-" + a.id, at: +x, title: a.label || t("Alarm"), body: fmtHM(a.h, a.m), kind: "alarm" }); break; } } });
  for (let d = 0; d < 7; d++) { const day = addDays(new Date(), d); evOn(dkey(day)).forEach((e) => { if (e.all || e.rem == null || e.rem < 0) return; const [h, m] = e.s.split(":"); const x = new Date(day); x.setHours(+h, +m, 0, 0); const at = +x - e.rem * 6e4; if (at > now) out.push({ id: "ev-" + e.id + "-" + d, at, title: e.title, body: fmtT(e.s), kind: "reminder" }); }); }
  P.todos.forEach((x) => { if (!x.done && x.due > now) out.push({ id: "td-" + x.id, at: x.due, title: t("To-do"), body: x.text, kind: "reminder" }); });
  if (P.timer.run && P.timer.end > now) out.push({ id: "timer", at: P.timer.end, title: t("Timer"), body: t("Time’s up"), kind: "alarm" });
  try { AndroidApp.setReminders(JSON.stringify(out.sort((a, b) => a.at - b.at).slice(0, 60))); } catch {}
}

/* reminders + alarms (runs every few seconds from tick) */
function checkReminders() {
  const now = Date.now(), d = new Date(), k = dkey(d), fire = (f) => { if (P.fired.includes(f)) return false; P.fired.push(f); if (P.fired.length > 300) P.fired.splice(0, 100); return true; };
  P.alarms.forEach((a) => { if (a.on && a.h === d.getHours() && a.m === d.getMinutes() && (!a.days.length || a.days.includes(d.getDay())) && fire(a.id + k + a.h + a.m)) { if (!a.days.length) a.on = false; save(); ring(a.label || t("Alarm"), fmtHM(a.h, a.m), 9); } });
  if (P.timer.run && now >= P.timer.end) { P.timer.run = false; P.timer.left = P.timer.set; save(); ring(t("Timer"), t("Time’s up"), 0); }
  if (P.snz && now >= P.snz.at) { const s = P.snz; P.snz = null; save(); ring(s.title, s.sub, s.snooze); }
  evOn(k).forEach((e) => { if (e.all || e.rem == null || e.rem < 0) return; const st = new Date(); const [h, m] = e.s.split(":"); st.setHours(+h, +m, 0, 0); if (now >= st - e.rem * 6e4 && now < +st + 6e4 && fire(e.id + k)) { toast(e.title, e.rem ? t("Starts in {0} min", e.rem) : t("Starting now")); notify(e.title, fmtT(e.s)); beepOnce(); } });
  P.todos.forEach((x) => { if (!x.done && x.due && now >= x.due && now < x.due + 36e5 && fire(x.id + x.due)) { toast(t("To-do"), x.text); notify(t("To-do"), x.text); beepOnce(660); } });
}

const AV_DEF = { dog: ["#C9A27E", "#F2EDE4"], cat: ["#FF9F0A", "#FFE8C7"], rabbit: ["#F2EDE4", "#FF8FB1"], penguin: ["#3A3A3C", "#F2EDE4"] };
const AV_NAMES = { dog: "Dog", cat: "Cat", rabbit: "Rabbit", penguin: "Penguin" };

  else if (k === "cat") a = `${mir("M24 47 22 17l22 15z", `fill="${c1}"`)}${mir("M28 39l-.6-13 10 7z", `fill="${c2}"`).replace(/stroke="#26262b" stroke-width="2.6"/g, 'stroke="none"')}<ellipse cx="50" cy="59" rx="29" ry="23" fill="${c1}" ${o}/><ellipse cx="50" cy="68" rx="11" ry="7.5" fill="${c2}"/><ellipse cx="38" cy="54" rx="3" ry="3.8" fill="${ink}"/><ellipse cx="62" cy="54" rx="3" ry="3.8" fill="${ink}"/><path d="M46.4 60.5h7.2L50 64.6z" fill="${c1}" ${o}/><path d="M50 64.6v3.2M44 70c2.6 2.4 4.6 2.4 6 0 1.4 2.4 3.4 2.4 6 0" fill="none" ${o}/><path d="M22 61l12 2M22 68l12-2M78 61 66 63M78 68l-12-2" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round"/>`;
  else if (k === "rabbit") a = `<g transform="rotate(-8 38 40)"><ellipse cx="38" cy="26" rx="8.5" ry="21" fill="${c1}" ${o}/><ellipse cx="38" cy="28" rx="3.8" ry="13.5" fill="${c2}"/></g><g transform="rotate(8 62 40)"><ellipse cx="62" cy="26" rx="8.5" ry="21" fill="${c1}" ${o}/><ellipse cx="62" cy="28" rx="3.8" ry="13.5" fill="${c2}"/></g><ellipse cx="50" cy="66" rx="26" ry="22.5" fill="${c1}" ${o}/><ellipse cx="37" cy="72" rx="7" ry="5" fill="${c2}" opacity=".85"/><ellipse cx="63" cy="72" rx="7" ry="5" fill="${c2}" opacity=".85"/><circle cx="39" cy="62" r="3" fill="${ink}"/><circle cx="61" cy="62" r="3" fill="${ink}"/><path d="M46.6 67h6.8L50 70.6z" fill="${c2}" ${o}/><path d="M50 70.6v3M44 75c2.6 2.4 4.6 2.4 6 0 1.4 2.4 3.4 2.4 6 0" fill="none" ${o}/>`;
  else a = `<ellipse cx="50" cy="58" rx="28" ry="33" fill="${c1}" ${o}/>${mir("M24 54c-9 6-9 17-4 25 5-3 9-9 9-17z", `fill="${c1}"`)}<ellipse cx="50" cy="66" rx="19" ry="23" fill="${c2}"/><circle cx="41" cy="45" r="4.6" fill="#fff" ${o}/><circle cx="59" cy="45" r="4.6" fill="#fff" ${o}/><circle cx="41.8" cy="45.6" r="2" fill="${ink}"/><circle cx="58.2" cy="45.6" r="2" fill="${ink}"/><path d="M43.5 52h13L50 60z" fill="${c2}" ${o}/><ellipse cx="38" cy="91" rx="9" ry="4.2" fill="${c2}" ${o}/><ellipse cx="62" cy="91" rx="9" ry="4.2" fill="${c2}" ${o}/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="${bg || c2}" opacity="${bg ? 1 : .32}"/>${a}</svg>`;
}
const avCur = () => P.av || { k: "dog", c1: AV_DEF.dog[0], c2: AV_DEF.dog[1] };
const avSvgOf = (c) => avatarSvg(c.k, c.c1, c.c2, c.bg);
A.avKind = (el) => { const k = el.dataset.v, c = P.av && P.av.k === k ? P.av : { k, c1: P.av ? P.av.c1 : AV_DEF[k][0], c2: P.av ? P.av.c2 : AV_DEF[k][1] }; P.av = { ...c, k }; P.img = ""; saveNow(); render(); };
A.avCol = (el) => { const c = { ...avCur() }; if (el.dataset.v) c[el.dataset.k] = el.dataset.v; else delete c[el.dataset.k]; P.av = c; P.img = ""; saveNow(); render(); };
A.avRemove = () => { P.av = null; P.img = ""; saveNow(); render(); };
function avFileInput() { let f = document.getElementById("avf"); if (!f) { f = document.createElement("input"); f.type = "file"; f.id = "avf"; f.accept = "image/*"; f.hidden = true; f.dataset.ch = "avatar"; document.body.appendChild(f); } return f; }
A.avPhoto = () => avFileInput().click();
SHEETS.avatar = () => {
  const c = avCur(), set = !!(P.av || P.img);
  const sw = (key, cur) => `<div class="colors">${key === "bg" ? `<button class="autoc ${!cur ? "on" : ""}" data-a="avCol" data-k="bg" data-v="" aria-label="${t("Auto")}" aria-pressed="${!cur}">${t("Auto")}</button>` : ""}${AV_COLS.map((x) => `<button style="background:${x}" aria-pressed="${cur === x}" aria-label="${x}" data-a="avCol" data-k="${key}" data-v="${x}"></button>`).join("")}</div>`;
  return { title: t("Profile picture"), body: `<div class="avbig ${P.img ? "" : "svg"}" style="${P.img ? `background-image:url(${P.img})` : ""}">${P.img ? "" : P.av ? avSvgOf(c) : `<span>${esc((P.name.trim()[0] || "?").toUpperCase())}</span>`}</div>
  <div class="lab">${t("Animals")}</div><div class="avgrid" role="radiogroup">${Object.keys(AV_DEF).map((k) => `<button class="avopt" role="radio" aria-checked="${!!P.av && P.av.k === k}" data-a="avKind" data-v="${k}" aria-label="${t(AV_NAMES[k])}">${avatarSvg(k, P.av && P.av.k === k ? c.c1 : AV_DEF[k][0], P.av && P.av.k === k ? c.c2 : AV_DEF[k][1])}<span>${t(AV_NAMES[k])}</span></button>`).join("")}</div>
  <div class="lab">${t("Main color")}</div>${sw("c1", P.av ? c.c1 : "")}<div class="lab">${t("Second color")}</div>${sw("c2", P.av ? c.c2 : "")}<div class="lab">${t("Background")}</div>${sw("bg", P.av ? c.bg || "" : "")}
  <div class="lab">${t("Your photo")}</div><div class="frow"><button class="btn" data-a="avPhoto">${I("image")}${t("Choose photo")}</button>${set ? `<button class="btn ghost" data-a="avRemove">${t("Remove")}</button>` : ""}</div>` };
};

/* ---- cropper ---- */
async function cropOpen(file) {
  let bmp; try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch { try { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); } catch { return toast(t("Couldn’t open that image")); } }
  const W = bmp.width, H = bmp.height; S.crop = { bmp, W, H, x: 0, y: 0, z: 1, tilt: 0, q: 0 }; S.stack.push({ id: "crop" }); render();
}
const CR = 640, CD = 480; // canvas px, circle diameter px
function cropDraw(out) {
  const c = S.crop; if (!c) return; const cv = out || $("#cropc"); if (!cv) return; const ctx = cv.getContext("2d"), size = out ? out.width : CR, k = out ? out.width / CD : 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, size, size);
  const base = CD / Math.min(c.W, c.H), rot = (c.q * 90 + c.tilt) * Math.PI / 180;
  ctx.save(); ctx.translate(size / 2 + c.x * k, size / 2 + c.y * k); ctx.rotate(rot); ctx.scale(base * c.z * k, base * c.z * k); ctx.imageSmoothingQuality = "high"; ctx.drawImage(c.bmp, -c.W / 2, -c.H / 2); ctx.restore();
  if (!out) {
    ctx.save(); ctx.fillStyle = "rgba(0,0,0,.58)"; ctx.beginPath(); ctx.rect(0, 0, CR, CR); ctx.arc(CR / 2, CR / 2, CD / 2, 0, Math.PI * 2, true); ctx.fill("evenodd"); ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(CR / 2, CR / 2, CD / 2, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 1.5; ctx.beginPath(); for (let i = 1; i < 3; i++) { const o = CR / 2 - CD / 2 + (CD / 3) * i; ctx.moveTo(o, CR / 2 - CD / 2); ctx.lineTo(o, CR / 2 + CD / 2); ctx.moveTo(CR / 2 - CD / 2, o); ctx.lineTo(CR / 2 + CD / 2, o); } ctx.save(); ctx.beginPath(); ctx.arc(CR / 2, CR / 2, CD / 2, 0, Math.PI * 2); ctx.clip(); ctx.stroke(); ctx.restore();
  }
}
function cropInit() {
  const cv = $("#cropc"); if (!cv || !S.crop || cv.__b) return; cv.__b = 1; const c = S.crop, pts = new Map(); let last = null;
  const scale = () => CR / cv.getBoundingClientRect().width;
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); last = null; });
  cv.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return; const prev = pts.get(e.pointerId), s = scale(); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) { c.x += (e.clientX - prev[0]) * s; c.y += (e.clientY - prev[1]) * s; }
    else if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; if (last) { c.z = clamp(c.z * (d / last.d), .4, 5); c.x += (m[0] - last.m[0]) * s; c.y += (m[1] - last.m[1]) * s; syncCropUI(); } last = { d, m }; }
    cropDraw();
  });
  const up = (e) => { pts.delete(e.pointerId); last = null; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", (e) => { e.preventDefault(); c.z = clamp(c.z * (e.deltaY < 0 ? 1.06 : 0.94), .4, 5); syncCropUI(); cropDraw(); }, { passive: false });
  cropDraw();
}
function syncCropUI() { const z = $("#crz"), t2 = $("#crt"); if (z) z.value = S.crop.z; if (t2) t2.value = S.crop.tilt; }
IN.crz = (el) => { S.crop.z = +el.value; cropDraw(); };
IN.crt = (el) => { S.crop.tilt = +el.value; cropDraw(); };
A.crRot = () => { S.crop.q = (S.crop.q + 1) % 4; cropDraw(); };
A.crReset = () => { Object.assign(S.crop, { x: 0, y: 0, z: 1, tilt: 0, q: 0 }); syncCropUI(); cropDraw(); };
A.crUse = () => { const o = document.createElement("canvas"); o.width = o.height = 320; cropDraw(o); P.img = o.toDataURL("image/jpeg", 0.88); P.av = null; saveNow(); S.crop = null; S.stack = []; render(); toast(t("Profile picture updated")); };
SHEETS.crop = () => ({ title: t("Move and Scale"), right: `<button class="btn sm" data-a="crUse">${t("Use")}</button>`, cls: "cropsheet", body: `<div class="cropwrap"><canvas id="cropc" width="${CR}" height="${CR}" aria-label="${t("Crop area")}"></canvas></div><div class="crc"><label>${I("zoom-in")}<input id="crz" type="range" min=".4" max="5" step=".01" value="${S.crop.z}" data-in="crz" aria-label="${t("Zoom")}"></label><label>${I("tilt")}<input id="crt" type="range" min="-45" max="45" step=".5" value="${S.crop.tilt}" data-in="crt" aria-label="${t("Tilt")}"></label><div class="frow" style="justify-content:center"><button class="btn ghost sm" data-a="crRot">${I("rotate-cw")}${t("Rotate")}</button><button class="btn ghost sm" data-a="crReset">${t("Reset")}</button></div></div>` });
init();

</script></body></html>
